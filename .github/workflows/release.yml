# SPDX-License-Identifier: Apache-2.0
name: release

# Tag-driven npm release with Sigstore provenance.
#
# `--provenance` cannot be produced outside CI: it needs the workflow's OIDC
# id-token, which is why this is a workflow and not a documented `npm publish`
# command. A tag is the only human decision; everything after it is mechanical.
#
# Usage:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Required repository secret: NPM_TOKEN — an npm automation token that may
# publish `fibemate-core`. The workflow fails before packing anything if the
# credential does not authenticate, so a bad token surfaces at the guard rather
# than after a tag is already public.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  issues: write # the registry-truth step files an issue when the run lies about publishing
  id-token: write # required for provenance (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve package identity
        id: pkg
        run: |
          node -e "
            const p = require('./package.json');
            if (p.private === true) { console.error('package is private'); process.exit(1); }
            if (!p.version) { console.error('no version'); process.exit(1); }
            console.log('name=' + p.name);
            console.log('version=' + p.version);
          " >> "$GITHUB_OUTPUT"

      - name: The tag must name the version it publishes
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "not a tag build, skipping tag/version check"
            exit 0
          fi
          expected="v${version}"
          echo "tag=${GITHUB_REF_NAME} expected=${expected} (package ${name})"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not name ${name}@${version} (expected ${expected})"
            exit 1
          fi

      - name: Skip when this exact version is already on the registry
        id: guard
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          npm view "$name@$version" version >/dev/null 2>&1
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "already published: $name@$version"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the registry credential identifies a publisher
        # Runs before anything is packed. An expired, revoked or wrong-account
        # token answers 401 here; without this step the first place it surfaces
        # is `npm publish`, after the tag already exists.
        if: steps.guard.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          EXPECTED_NPM_USER: lennonhaha
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is empty — set it in repository secrets"
            exit 1
          fi
          who=$(npm whoami)
          echo "registry identity: $who (expected: $EXPECTED_NPM_USER, compared case-insensitively)"
          who_lc=$(printf '%s' "$who" | tr '[:upper:]' '[:lower:]')
          exp_lc=$(printf '%s' "$EXPECTED_NPM_USER" | tr '[:upper:]' '[:lower:]')
          if [ "$who_lc" != "$exp_lc" ]; then
            echo "::error::token authenticates as '$who', not '$EXPECTED_NPM_USER'; refusing to publish under the wrong account"
            exit 1
          fi

      - name: Preflight — the reference tests pass
        if: steps.guard.outputs.skip != 'true'
        run: npm test

      - name: Preflight — licence and readme ship, tests do not
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for f in LICENSE README.md; do
            [ -f "$f" ] || { echo "::error::$f missing from the package root"; exit 1; }
          done
          tarball=$(npm pack --silent | tail -n 1)
          trap 'rm -f "$PWD/$tarball"' EXIT
          tar -tzf "$tarball" | sed 's/\r$//' > /tmp/entries.txt
          grep -qx 'package/LICENSE' /tmp/entries.txt || { echo "::error::LICENSE not in tarball"; exit 1; }
          grep -qx 'package/README.md' /tmp/entries.txt || { echo "::error::README.md not in tarball"; exit 1; }
          for bad in '/test/' '\.github/' '\.bak' '\.orig'; do
            if grep -Eq "$bad" /tmp/entries.txt; then
              echo "::error::tarball contains a path matching $bad"
              grep -E "$bad" /tmp/entries.txt
              exit 1
            fi
          done
          echo "contents ok: $(wc -l < /tmp/entries.txt) entries"

      - name: Preflight — install the tarball and run a KEM round trip
        # The package is CommonJS on purpose (dual-use with a plain <script>
        # include), so this checks require(), not import().
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          tarball=$(npm pack --silent | tail -n 1)
          tarball_path="$PWD/$tarball"
          trap 'rm -f "$tarball_path"' EXIT
          work=$(mktemp -d)
          cd "$work"
          npm init -y >/dev/null
          npm install "$tarball_path" --no-audit --no-fund
          node -e "
            const kem = require('$name');
            const { publicKey, secretKey } = kem.generateKeypair();
            const { ciphertext, sharedSecret } = kem.encapsulate(publicKey);
            const recovered = kem.decapsulate(secretKey, ciphertext);
            const ok = Buffer.compare(Buffer.from(sharedSecret), Buffer.from(recovered)) === 0;
            console.log('pk=' + publicKey.length + 'B sk=' + secretKey.length + 'B ct=' + ciphertext.length + 'B ss=' + sharedSecret.length + 'B roundtrip=' + ok);
            if (!ok) throw new Error('KEM round trip failed');
            if (publicKey.length !== 1184 || secretKey.length !== 2400 || ciphertext.length !== 1088 || sharedSecret.length !== 32) {
              throw new Error('encoded sizes differ from FIPS 203 ML-KEM-768');
            }
          "

      - name: Publish with provenance
        id: publish
        if: steps.guard.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Confirm the registry sees the release
        # Advisory only. This step used to decide whether the release "happened";
        # it read a 404 during npm staged publishing on 2026-11-15 and turned a
        # successful publish into a red run that nobody reconciled for 11 days.
        # The authoritative check is the next step, which asks the registry.
        id: confirm
        continue-on-error: true
        # A brand-new package can land in npm's staged publishing: the registry
        # accepts the tarball, reserves the name with a `0.0.0-stage` placeholder
        # and waits for a human to approve the version with 2FA. That is not a
        # failure of this workflow, so poll for a while, then report which state
        # the registry is actually in instead of a bare 404.
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          for i in $(seq 1 18); do
            if npm view "$name@$version" version >/dev/null 2>&1; then
              npm view "$name@$version" version dist.tarball dist.integrity dist.attestations --json
              exit 0
            fi
            tags=$(npm view "$name" dist-tags --json 2>/dev/null || echo '{}')
            if printf '%s' "$tags" | grep -q '0.0.0-stage'; then
              echo "staged: the registry holds $name@$version behind a 0.0.0-stage placeholder"
              echo "approve it at https://www.npmjs.com/package/$name (Staged releases) with 2FA"
              echo "::warning::$name@$version is staged and awaits approval; it is not installable yet"
              exit 0
            fi
            echo "waiting for the registry to index $name@$version (attempt $i/18)"
            sleep 10
          done
          echo "::error::$name@$version did not become visible within 3 minutes"
          exit 1

      - name: Registry truth — ask the registry, not this run
        # Runs whenever publish was attempted, including when publish itself
        # failed. If the registry has the version, that is the fact; the run's
        # conclusion is not. Missing version after the timeout stays a failure.
        id: truth
        if: always() && steps.publish.outcome != 'skipped' && steps.publish.outcome != ''
        run: |
          set +e
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          tarball=$(npm pack --silent | tail -n 1)
          node scripts/verify-registry-truth.cjs \
            --package "$name" \
            --version "$version" \
            --timeout 900 \
            --interval 10 \
            --tarball "$tarball" \
            --json-out registry-truth.json
          rc=$?
          rm -f "$tarball"
          set -e
          if [ $rc -eq 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          exit $rc

      - name: Alert — the registry disagrees with this run
        # A green registry plus a failed confirm/publish is the exact shape of
        # the 2026-11-15 incident. File one issue per version, not per attempt.
        if: always() && steps.truth.outputs.found == 'true' && (steps.confirm.outcome != 'success' || steps.publish.outcome != 'success')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name="${{ steps.pkg.outputs.name }}"
          version="${{ steps.pkg.outputs.version }}"
          title="[release] ${name}@${version} is on the registry but the workflow reported failure"
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "${name}@${version} in:title" --json number --jq '.[0].number // empty')
          body=$(cat <<EOF
          @Lennonhaha — registry truth contradicts this workflow run.

          - package: `${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}`
          - registry: `https://www.npmjs.com/package/${{ steps.pkg.outputs.name }}/v/${{ steps.pkg.outputs.version }}`
          - run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - publish step: `${{ steps.publish.outcome }}`
          - confirm step: `${{ steps.confirm.outcome }}`
          - registry truth: `${{ steps.truth.outputs.found }}`

          The package exists on the registry. Treat the run conclusion as wrong about the release, verify the tarball, and if it is good, do not re-publish. This issue exists so that a false red run cannot hide a live package again.
          EOF
          )
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "$body"
            echo "commented on existing issue #$existing"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body" --assignee Lennonhaha
          fi

      - name: Record result
        if: always()
        run: |
          {
            echo "### ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}"
            echo ""
            echo "- tag: \`${GITHUB_REF_NAME}\`"
            echo "- event: ${GITHUB_EVENT_NAME}"
            echo "- skipped (already on registry): ${{ steps.guard.outputs.skip }}"
            echo "- job status: ${{ job.status }}"
            echo "- publish step: ${{ steps.publish.outcome }}"
            echo "- confirm step (advisory): ${{ steps.confirm.outcome }}"
            echo "- registry truth: ${{ steps.truth.outputs.found }}"
            if [ -f registry-truth.json ]; then
              echo ""
              echo '```json'
              cat registry-truth.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
